spring:
  application:
    name: mediconnect-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mediconnect}
    username: ${DB_USERNAME:mediconnect}
    password: ${DB_PASSWORD:mediconnect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Amman
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

mediconnect:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-min-32-bytes-secret-value}
      access-ttl-seconds: 900
      refresh-ttl-days: 14
      issuer: mediconnect
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:mock}

logging:
  level:
    root: INFO
    com.mediconnect: INFO
